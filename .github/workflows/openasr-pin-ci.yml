name: OpenASR pin

on:
  push:
    branches:
      - "oasr/pin-*"
  pull_request:
    branches:
      - "oasr/pin-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openasr-pin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }}, ${{ matrix.linkage }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        linkage:
          - shared
          - static
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out pin
        uses: actions/checkout@v6

      - name: Install Ubuntu build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang ninja-build

      - name: Add MSBuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Configure
        run: >-
          cmake -S . -B build
          ${{ runner.os == 'Windows' && '-A x64' || '-G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++' }}
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_BUILD_TESTS=ON
          -DBUILD_SHARED_LIBS=${{ matrix.linkage == 'shared' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --timeout 900

  required:
    name: required
    if: always()
    needs:
      - build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Require every pin build
        env:
          BUILD_RESULT: ${{ needs.build-and-test.result }}
        run: test "${BUILD_RESULT}" = "success"
